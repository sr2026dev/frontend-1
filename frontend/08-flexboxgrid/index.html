<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox Grid</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <!-- Flexbox -->

    <div class="flexbox">
        <p>Testando</p>
        <p>meu</p>
        <p>FlexBox</p>
        <p>na tela</p>
    </div>

    <!-- Flex Direction -->
    <div class="flex-direction">
        <span>a</span>
        <span>b</span>
        <span>c</span>
    </div>
    
    <!-- Flex wrap -->
    <div class="flex-wrap">
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
    </div>

    <!-- Flex Justify-content -->
    <h2>Centralizado</h2>
    <div class="center">
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
    </div>

    <h2>Espaço ao redor</h2>
    <div class="space-around">
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
    </div>

    <h2>Espaço entre</h2>
    <div class="space-between">
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
    </div>

    <h2>Fim</h2>
    <div class="end">
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
    </div>
 
    <!-- Flex Align  -->
    <h2>Centralizando</h2>
    <div class="align-center">
            <div class="caixa"></div>
            <div class="caixa"></div>
            <div class="caixa"></div>
    </div>
    
        <h2>No Final</h2>
         <div class="flex-end">
            <div class="caixa"></div>
            <div class="caixa"></div>
            <div class="caixa"></div>
        </div>

        <h2>Alongado</h2>
         <div class="strech">
            <div class="caixa"></div>
            <div class="caixa"></div>
            <div class="caixa"></div>
        </div>

    <!-- Gap - como se fosse uma margem entre os elementos de um grid -->
     <h2>Gap</h2>
     <div class="gap">
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
        <div class="caixa"></div>
     </div>
    
    <!-- align-self caixas diferenciadas dentro da div - substitui o align Items-->
    <h2>Align-self</h2>
    <div class="align-self">
        <div class="caixa">1</div>
        <div class="caixa diferenciada">2</div>
        <div class="caixa diferenciada2">3</div>
    </div>
    
</body>
</html>
